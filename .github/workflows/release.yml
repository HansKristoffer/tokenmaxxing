# release-please keeps a Release PR open with the next version + changelog.
# Merging it tags vX.Y.Z and creates the GitHub Release; the jobs below then
# build, sign and notarize the desktop app, attach it, and bump the Homebrew cask.
# Railway deploys the server from main on its own.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The desktop app: a universal build, signed, notarized, and its updater archive signed; the
  # .dmg, .app.tar.gz, .sig and latest.json go on this release, where installed apps look for updates.
  app:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/desktop/src-tauri
      - run: bun install --frozen-lockfile --ignore-scripts
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKENMAXXING_SERVER_URL: ${{ vars.TOKENMAXXING_SERVER_URL }}
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERT_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          # Losing this key means installed apps can never update again: keep it in the password manager.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/desktop
          tauriScript: bunx tauri
          tagName: ${{ needs.release-please.outputs.tag }}
          includeUpdaterJson: true
          args: --target universal-apple-darwin

  cask:
    needs: [release-please, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render the cask with this release's checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release download "$TAG" --pattern "Tokenmaxxing_${VERSION}_universal.dmg" --dir dist
          export SHA=$(sha256sum "dist/Tokenmaxxing_${VERSION}_universal.dmg" | cut -d' ' -f1)
          envsubst '$VERSION $SHA' < packaging/tokenmaxxing.rb > tokenmaxxing.rb
      - name: Push to the tap
        env:
          # Write deploy key on HansKristoffer/homebrew-tap only.
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          install -m 600 /dev/null ~/tap_key && printf '%s\n' "$TAP_DEPLOY_KEY" > ~/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:HansKristoffer/homebrew-tap.git tap
          mkdir -p tap/Casks && cp tokenmaxxing.rb tap/Casks/tokenmaxxing.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/tokenmaxxing.rb
          git commit -m "tokenmaxxing $VERSION"
          git push
