<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Welcome to Tokenmaxxing</title>
    <link rel="stylesheet" href="onboarding.css" />
    <script src="onboarding.js" defer></script>
  </head>
  <body>
    <form id="sign-up">
      <h1><img src="icon.png" width="32" height="32" alt="" /> tokenmaxxing</h1>
      <p>Pick a name. It's what everyone in town sees above your character.</p>
      <input id="name" aria-label="Name" autocomplete="off" spellcheck="false" maxlength="32" />
      <p id="error" class="error" role="alert"></p>
      <button type="submit" id="go">Walk into town</button>
      <p class="small">Only token counts, model names and timestamps leave this Mac. Never message content.</p>
    </form>
  </body>
</html>
