[package]
name = "tokenmaxxing"
# The app's version comes from the root package.json (see tauri.conf.json); this one isn't used.
version = "0.0.0"
description = "A tiny pixel town for people who run AI coding agents"
authors = ["Hans Kristoffer"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tokenmaxxing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# The device token lives in the login Keychain, where the Swift app kept it: see keychain.rs.
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
