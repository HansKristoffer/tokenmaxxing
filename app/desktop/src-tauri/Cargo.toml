[package]
name = "tokenmaxxing"
# The app's version comes from the root package.json (see tauri.conf.json); this one isn't used.
version = "0.0.0"
description = "A tiny pixel town for people who run AI coding agents"
authors = ["Hans Kristoffer"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "tokenmaxxing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# The device token lives in the login Keychain, where the Swift app kept it: see keychain.rs.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

# Elsewhere it's in Credential Manager (Windows) or the Secret Service over D-Bus (Linux; needs libdbus
# to build), and the clipboard for "Link a computer…" comes from arboard (pbcopy on the Mac).
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native", "sync-secret-service", "crypto-rust"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
